<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pisey Ou</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    letter-spacing: 0.12em;
  }
  .label { text-transform: uppercase; }
  @keyframes fadeOut { to { opacity: 0; } }
  body.bye { animation: fadeOut 0.3s 0.1s ease both; }
</style>
</head>
<body>
<span class="label">Loading…</span>
<script>
  var pages = [
    'pages/direction-1-terminal.html',
    'pages/direction-2-literary.html',
    'pages/direction-3-swiss.html',
    'pages/direction-4-aurora.html',
    'pages/direction-5-original.html'
  ];
  var pick = pages[Math.floor(Math.random() * pages.length)];
  setTimeout(function () {
    document.body.classList.add('bye');
    setTimeout(function () { window.location.replace(pick); }, 400);
  }, 120);
</script>
</body>
</html>
