<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pisey Ou</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    color: rgba(255,255,255,0.25);
    font-size: 11px;
    letter-spacing: 0.14em;
  }
</style>
</head>
<body>
<span>Loading…</span>
<script>
  var pages = [
    'pages/direction-1-terminal.html',
    'pages/direction-2-literary.html',
    'pages/direction-3-swiss.html',
    'pages/direction-4-aurora.html',
    'pages/direction-5-original.html'
  ];
  var saved = null;
  try { saved = localStorage.getItem('pisey-theme'); } catch (e) {}
  var pick = (saved && pages.indexOf(saved) !== -1)
    ? saved
    : pages[Math.floor(Math.random() * pages.length)];
  window.location.replace(pick);
</script>
</body>
</html>
